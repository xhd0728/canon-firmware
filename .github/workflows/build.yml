name: Build EOS 60D
run-name: EOS 60D ${{ inputs.language }} · ${{ inputs.publish && inputs.tag || 'artifacts only' }}

on:
  workflow_dispatch:
    inputs:
      language:
        description: Language (publishing always builds both)
        type: choice
        options: [both, en, zh]
        default: both
      publish:
        description: Publish an experimental GitHub prerelease
        type: boolean
        default: false
      tag:
        description: New release tag, e.g. 60d-2026.10.30
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: eos60d-${{ inputs.publish && inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  check-inputs:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release tag and branch
        env:
          PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$PUBLISH" == "true" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo 'Publish from main only'; exit 1; }
            [[ "$RELEASE_TAG" =~ ^60d-[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo 'Use a tag beginning 60d-'; exit 1; }
            git check-ref-format "refs/tags/$RELEASE_TAG"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo 'Tag already exists; choose a new tag'; exit 1
            fi
          fi

  build:
    needs: check-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON((inputs.publish || inputs.language == 'both') && '["en","zh"]' || (inputs.language == 'en' && '["en"]' || '["zh"]')) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential zip
          python3 scripts/setup.py
      - name: Compile and validate EOS 60D
        run: python3 scripts/build.py --language '${{ matrix.language }}'
      - name: Upload build products
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eos60d-111-${{ matrix.language }}
          path: |
            dist/${{ matrix.language }}/*.zip
            dist/${{ matrix.language }}/*.tar.gz
            dist/${{ matrix.language }}/*.json
            dist/${{ matrix.language }}/SHA256SUMS-*.txt
          if-no-files-found: error
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-${{ matrix.language }}
          path: dist/${{ matrix.language }}/build.log
          if-no-files-found: ignore

  release:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: eos60d-111-*
          path: release
          merge-multiple: true
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd release
          sha256sum -c SHA256SUMS-en.txt
          sha256sum -c SHA256SUMS-zh.txt
          cat SHA256SUMS-en.txt SHA256SUMS-zh.txt > SHA256SUMS.txt
          python3 ../scripts/release_notes.py > ../release-notes.md
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "EOS 60D — $RELEASE_TAG (English + Chinese)" \
            --prerelease --notes-file ../release-notes.md \
            ./*.zip ./*.tar.gz ./*.json SHA256SUMS.txt
